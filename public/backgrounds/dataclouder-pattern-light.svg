<svg xmlns='http://www.w3.org/2000/svg' width='100%' height='100%' viewBox='0 0 1440 900' preserveAspectRatio='xMidYMid slice'>
  <defs>
    <!-- Background Linear Base -->
    <linearGradient id='light-base' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#f5f3f8'/>
      <stop offset='50%' stop-color='#ebf3fc'/>
      <stop offset='100%' stop-color='#f0f4fb'/>
    </linearGradient>

    <!-- Deep Purple Ambient Glow -->
    <radialGradient id='purple-glow' cx='15%' cy='20%' r='45%'>
      <stop offset='0%' stop-color='#2d0c62' stop-opacity='0.12'/>
      <stop offset='60%' stop-color='#5a44ba' stop-opacity='0.04'/>
      <stop offset='100%' stop-color='#2d0c62' stop-opacity='0'/>
    </radialGradient>

    <!-- Dataclouder Blue Ambient Glow -->
    <radialGradient id='blue-glow' cx='85%' cy='75%' r='50%'>
      <stop offset='0%' stop-color='#3677bd' stop-opacity='0.14'/>
      <stop offset='50%' stop-color='#5cbae7' stop-opacity='0.05'/>
      <stop offset='100%' stop-color='#3677bd' stop-opacity='0'/>
    </radialGradient>

    <!-- Secondary Violet Orb -->
    <radialGradient id='violet-glow' cx='60%' cy='25%' r='35%'>
      <stop offset='0%' stop-color='#858cdd' stop-opacity='0.10'/>
      <stop offset='100%' stop-color='#858cdd' stop-opacity='0'/>
    </radialGradient>

    <!-- Technical Dot Grid Pattern -->
    <pattern id='tech-grid' width='36' height='36' patternUnits='userSpaceOnUse'>
      <circle cx='18' cy='18' r='1.2' fill='#3677bd' fill-opacity='0.14'/>
      <path d='M 36 0 L 0 0 0 36' fill='none' stroke='#2d0c62' stroke-width='0.4' stroke-opacity='0.04'/>
    </pattern>
  </defs>

  <!-- Base Rectangle -->
  <rect width='100%' height='100%' fill='url(#light-base)'/>

  <!-- Ambient Glow Layers -->
  <rect width='100%' height='100%' fill='url(#purple-glow)'/>
  <rect width='100%' height='100%' fill='url(#blue-glow)'/>
  <rect width='100%' height='100%' fill='url(#violet-glow)'/>

  <!-- Tech Grid Overlay -->
  <rect width='100%' height='100%' fill='url(#tech-grid)'/>
</svg>
