<svg xmlns='http://www.w3.org/2000/svg' width='100%' height='100%' viewBox='0 0 1440 900' preserveAspectRatio='xMidYMid slice'>
  <defs>
    <!-- Background Linear Base: Night Violet -->
    <linearGradient id='dark-base' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#080214'/>
      <stop offset='50%' stop-color='#0b0319'/>
      <stop offset='100%' stop-color='#05010c'/>
    </linearGradient>

    <!-- Deep Purple Ambient Glow Orb -->
    <radialGradient id='dark-purple-glow' cx='20%' cy='25%' r='50%'>
      <stop offset='0%' stop-color='#2d0c62' stop-opacity='0.45'/>
      <stop offset='60%' stop-color='#461f87' stop-opacity='0.15'/>
      <stop offset='100%' stop-color='#2d0c62' stop-opacity='0'/>
    </radialGradient>

    <!-- Neon Mint Ambient Glow Orb -->
    <radialGradient id='neon-mint-glow' cx='80%' cy='80%' r='45%'>
      <stop offset='0%' stop-color='#4ef9ba' stop-opacity='0.20'/>
      <stop offset='45%' stop-color='#3677bd' stop-opacity='0.12'/>
      <stop offset='100%' stop-color='#0b0319' stop-opacity='0'/>
    </radialGradient>

    <!-- Royal / Sky Blue Center Highlight -->
    <radialGradient id='blue-core-glow' cx='50%' cy='40%' r='40%'>
      <stop offset='0%' stop-color='#0b3db0' stop-opacity='0.25'/>
      <stop offset='70%' stop-color='#5cbae7' stop-opacity='0.05'/>
      <stop offset='100%' stop-color='#080214' stop-opacity='0'/>
    </radialGradient>

    <!-- Subtle Tech Matrix Grid -->
    <pattern id='dark-tech-grid' width='40' height='40' patternUnits='userSpaceOnUse'>
      <circle cx='20' cy='20' r='1.2' fill='#4ef9ba' fill-opacity='0.22'/>
      <path d='M 40 0 L 0 0 0 40' fill='none' stroke='#4ef9ba' stroke-width='0.4' stroke-opacity='0.05'/>
    </pattern>
  </defs>

  <!-- Base Night Violet Layer -->
  <rect width='100%' height='100%' fill='url(#dark-base)'/>

  <!-- Glowing Ambiance -->
  <rect width='100%' height='100%' fill='url(#dark-purple-glow)'/>
  <rect width='100%' height='100%' fill='url(#neon-mint-glow)'/>
  <rect width='100%' height='100%' fill='url(#blue-core-glow)'/>

  <!-- Geometric Grid Matrix Overlay -->
  <rect width='100%' height='100%' fill='url(#dark-tech-grid)'/>
</svg>
